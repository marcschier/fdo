name: Stage Fdo in GitHub Packages

on:
  push:
    tags: ['v*']

permissions:
  actions: read
  contents: read

concurrency: fdo-stage-${{ github.ref }}

jobs:
  stage:
    if: github.repository == 'marcschier/fdo' && vars.FDO_ENABLE_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.404
            11.0.100
      - name: Require successful CI for the exact tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$sha" origin/main
          gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$sha&branch=main&event=push&status=success" \
            --jq '.total_count' | grep -Eq '^[1-9][0-9]*$'
        shell: bash
      - name: Pack and check the exact tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$') {
            throw 'Invalid release tag.'
          }
          dotnet pack src/Fdo/Fdo.csproj -c Release -o bin/packages -p:PublicRelease=true
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./eng/Test-Package.ps1 -Directory bin/packages
          $expected = "Fdo.$($env:TAG.Substring(1)).nupkg"
          if (!(Test-Path -LiteralPath "bin/packages/$expected" -PathType Leaf)) {
            throw "Release tag does not match package version: $expected"
          }
      - name: Push to GitHub Packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet nuget push 'bin/packages/*.nupkg' --source https://nuget.pkg.github.com/marcschier/index.json --api-key "$GH_TOKEN" --no-symbols
